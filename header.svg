<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Divya Chokshi, Senior Salesforce Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .cur{animation:blink 1.1s steps(1) infinite}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#060a1c"/>
      <stop offset="0.55" stop-color="#0f1a52"/>
      <stop offset="1" stop-color="#341a68"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a05aff"/>
      <stop offset="1" stop-color="#ffb040"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- glows -->
  <circle cx="930" cy="-10" r="170" fill="#22d3ee" fill-opacity="0.28" filter="url(#blur)"/>
  <circle cx="1170" cy="330" r="190" fill="#ff8c50" fill-opacity="0.30" filter="url(#blur)"/>
  <circle cx="1010" cy="200" r="150" fill="#a05aff" fill-opacity="0.25" filter="url(#blur)">
    <animate attributeName="r" values="150;175;150" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- faint cloud watermark -->
  <g fill="#ffffff" fill-opacity="0.045">
    <rect x="-20" y="170" width="330" height="90" rx="40"/>
    <circle cx="70" cy="190" r="70"/>
    <circle cx="190" cy="160" r="95"/>
    <circle cx="285" cy="205" r="55"/>
  </g>

  <!-- left text -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="86" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="4">HELLO, I'M</text>
    <text x="62" y="152" fill="#ffffff" font-size="68" font-weight="800">Divya Chokshi</text>
    <text x="64" y="198" fill="#bedef7" font-size="30" font-weight="600">Senior Salesforce Developer</text>
    <rect x="64" y="218" width="96" height="4" rx="2" fill="url(#rule)"/>
    <text x="64" y="256" fill="#9fb6dd" font-size="16.5">Sales  |  Service  |  Experience  |  FSC  |  Automotive  |  CRM Analytics  |  Apex  |  LWC</text>
    <text x="64" y="284" fill="#7f95c4" font-size="16">Mumbai, India</text>
  </g>

  <!-- code window -->
  <g filter="url(#shadow)">
    <rect x="760" y="52" width="400" height="216" rx="16" fill="#080c20" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18"/>
    <path d="M760 68a16 16 0 0 1 16-16h368a16 16 0 0 1 16 16v20H760z" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="784" cy="70" r="6" fill="#ff5f56"/>
    <circle cx="804" cy="70" r="6" fill="#ffbd2e"/>
    <circle cx="824" cy="70" r="6" fill="#27c93f"/>
    <text x="960" y="75" fill="#96a5cd" font-size="13" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">Divya.cls</text>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" style="white-space:pre" xml:space="preserve">
    <text x="782" y="118"><tspan fill="#c792ea">public class </tspan><tspan fill="#ffcb6b">Divya</tspan><tspan fill="#89ddff"> {</tspan></text>
    <text x="782" y="146"><tspan fill="#e2eafa">&#160;&#160;String role  = </tspan><tspan fill="#c3e88d">'Salesforce Developer'</tspan><tspan fill="#89ddff">;</tspan></text>
    <text x="782" y="174"><tspan fill="#e2eafa">&#160;&#160;String focus = </tspan><tspan fill="#c3e88d">'Experience Cloud'</tspan><tspan fill="#89ddff">;</tspan></text>
    <text x="782" y="202"><tspan fill="#e2eafa">&#160;&#160;String data  = </tspan><tspan fill="#c3e88d">'CRM Analytics'</tspan><tspan fill="#89ddff">;</tspan></text>
    <text x="782" y="230"><tspan fill="#e2eafa">&#160;&#160;Boolean building = </tspan><tspan fill="#f78c6c">true</tspan><tspan fill="#89ddff">;</tspan><tspan class="cur" fill="#ffb040">&#160;&#9608;</tspan></text>
    <text x="782" y="258"><tspan fill="#89ddff">}</tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
