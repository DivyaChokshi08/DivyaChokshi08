<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="How I ship: Develop, Test, INT, UAT, PROD" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1f"/><stop offset="1" stop-color="#241a5c"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a05aff"/><stop offset="1" stop-color="#ffb040"/></linearGradient>
<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs>
<rect width="1000" height="230" rx="20" fill="url(#bg)" stroke="#fff" stroke-opacity="0.14"/>
<text x="30" y="40" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="3" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">HOW I SHIP</text>
<rect x="100" y="106" width="800" height="4" rx="2" fill="url(#line)" fill-opacity="0.6"/>
<circle cx="100" cy="108" r="26" fill="#22d3ee" fill-opacity="0.25"/><circle cx="100" cy="108" r="14" fill="#22d3ee"/>
<g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle"><text x="100" y="160" fill="#fff" font-size="18" font-weight="700">Develop</text><text x="100" y="182" fill="#9fb6dd" font-size="14">Apex, LWC</text></g>
<circle cx="300" cy="108" r="26" fill="#1ebe8c" fill-opacity="0.25"/><circle cx="300" cy="108" r="14" fill="#1ebe8c"/>
<g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle"><text x="300" y="160" fill="#fff" font-size="18" font-weight="700">Test</text><text x="300" y="182" fill="#9fb6dd" font-size="14">Robotic Testing</text></g>
<circle cx="500" cy="108" r="26" fill="#5a82f0" fill-opacity="0.25"/><circle cx="500" cy="108" r="14" fill="#5a82f0"/>
<g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle"><text x="500" y="160" fill="#fff" font-size="18" font-weight="700">INT</text><text x="500" y="182" fill="#9fb6dd" font-size="14">Integration env</text></g>
<circle cx="700" cy="108" r="26" fill="#a05aff" fill-opacity="0.25"/><circle cx="700" cy="108" r="14" fill="#a05aff"/>
<g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle"><text x="700" y="160" fill="#fff" font-size="18" font-weight="700">UAT</text><text x="700" y="182" fill="#9fb6dd" font-size="14">User testing</text></g>
<circle cx="900" cy="108" r="26" fill="#ffb040" fill-opacity="0.25"/><circle cx="900" cy="108" r="14" fill="#ffb040"/>
<g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle"><text x="900" y="160" fill="#fff" font-size="18" font-weight="700">PROD</text><text x="900" y="182" fill="#9fb6dd" font-size="14">Release</text></g>
<circle r="9" fill="#fff" filter="url(#gl)"><animateMotion dur="6s" repeatCount="indefinite" path="M100 108 H900"/></circle>
<circle r="5" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M100 108 H900"/></circle>
<text x="500" y="214" fill="#7f95c4" font-size="13" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Changes move through the pipeline with Copado, not by hand</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>